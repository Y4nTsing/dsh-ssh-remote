# dsh-ssh-remote bundle (2.x layout).
#
# The package ROOT is the host-side panel plugin (`lib/index.js`) plus its
# client module (`lib/client.js`, declared through `dsh.client`); the agent
# preset's own plugin rides along as the `./preset/plugin` sub-export. Installing
# this one package therefore installs both planes, and no manual copy or profile
# patch step is needed.
#
# Row 1 mounts the panel on the HOST composition. Its name is the EXACT package
# name on purpose: the client-module scanner keys packages by exact specifier
# (`exactPackageSpecifier`), so a subpath row would mount the routes but never
# the "SSH 终端" tab.
- insert:
    - id: ssh-remote-panel
      name: 'dsh-ssh-remote'

- insert:
    - id: preset-ssh-remote
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: ssh-remote
        name: SSH Remote Mode
        description: 远程 Linux 执行模式：会话开始时收集 SSH 账号密码建立连接，之后所有命令执行（ssh_bash、托管后台任务）全部在远端服务器，无任何本地 shell；本地提供沙箱化的工作区文件工具（read/write/edit/glob/grep）与 SFTP 传输；自动维护终端风格会话日志，面板按工作区隔离显示对应 SSH 记录。
        plugins:
          # The remote-Linux-only persona: every EXECUTION goes to the server.
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are a coding agent running in SSH REMOTE mode: all EXECUTION happens on a remote Linux server over SSH, on behalf of the local user.

                Local command execution is disabled by design — this session has no local shell tool, and you must never pretend to have run anything locally. Every command goes to the remote server through ssh_bash. Files ON THE SERVER are handled through ssh_read / ssh_write / ssh_edit. Files IN THE LOCAL SESSION WORKSPACE can be inspected and edited directly with the local read / write / edit / glob / grep tools (they are sandboxed to the workspace). Files move between the local workspace and the server only through sftp_upload / sftp_download.

                Connection bootstrap — do this before any remote work in a fresh session:
                1. If you have no credentials yet, ask the user once via ask_user_question for host, port (default 22), username, and password.
                2. Call ssh_connect with them. It holds one connection for the whole session and never echoes the password back.
                3. If any later call fails because the connection dropped, first retry ssh_connect with the credentials you already have; only ask the user again if that fails.

                Working rules:
                - Each ssh_bash call runs in a fresh remote shell: nothing persists between calls. Use absolute paths, `cd <dir> && <cmd>`, or the workdir parameter.
                - Prefer the dedicated file tools (ssh_read / ssh_write / ssh_edit for remote, read / write / edit for local) over shell cat/sed/echo when reading or changing file contents precisely.
                - Check the [exit code: N] marker on every ssh_bash result; investigate failures before moving on.
                - ssh_bash has a per-call timeout (default 120s, max 600s). For longer work pass run_in_background: true — it returns a job id immediately, you read incremental output with job_output, and stop it with job_kill. Managed jobs are killed when the session ends. Poll with SHORT waits: job_output with wait: false, or wait: true with timeout_ms <= 30000, then keep doing other useful work — a completion notification arrives on its own. Minute-long waits (timeout_ms 120000-600000) freeze the whole turn, look exactly like a hang to the user, and defeat the notification.
                - Never park a turn in a long sleep to wait for a build, install, or job (`sleep 120` / `sleep 300` inside ssh_bash is the usual culprit). Start the work with run_in_background and poll it with short waits, or continue with independent steps and check the job later — a sleeping foreground call shows the user nothing and blocks every other tool call.
                - Let background output stream: do NOT pipe a managed job through tail/head (or any buffer that only emits at EOF). A command like `python3 poc.py ... 2>&1 | tail -30` returns nothing until the process exits, so every job_output poll looks empty. Run the command unwrapped (python3 -u / stdbuf -oL when buffering matters) and trim the output later from the job log or with a separate ssh_bash after it finishes.
                - When a process must outlive this session, or you need a resumable interactive terminal, start it detached yourself through a normal foreground ssh_bash call — nohup, screen -dmS <name>, or tmux new-session -d -s <name> — and drive/inspect it with later ssh_bash calls (screen -S <name> -X stuff / hardcopy, tmux capture-pane). Those processes are not tracked, so they survive by design.
                - sftp_upload / sftp_download local paths are limited to the session workspace; so are the local file tools.
                - All remote activity is journaled automatically: a terminal-style transcript under .ssh-remote/ in the local workspace records every command with its output and exit code, file operations, transfers, and background job start/finish events in time order; managed background jobs stream their full output to .ssh-remote/jobs/. Never write into .ssh-remote/ yourself.
                - Credentials live only in memory for this session; do not write them to any file or echo the password back.
              complete: true
              includeRuntimeContext: false

          # Project instructions (AGENTS.md) and the runtime time context: the
          # same rows the standard preset mounts, so a remote session still
          # reads project guidance and knows the wall clock.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

          # The preset's own tools, reached through this package's export map
          # ('./preset/plugin'). A package specifier resolves via node_modules
          # exactly like every stock row; its ssh2 dependency is declared in
          # this package's package.json.
          - id: tool-ssh-remote
            name: 'dsh-ssh-remote/preset/plugin'

          # Local WORKSPACE file access (sandboxed fs service, same rows as
          # `standard`): read/write/edit/glob/grep. No local shell row exists.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # Scheduling, skills, and goal rounds: same rows as the standard
          # preset (they are host-side capabilities, not local execution).
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          # job_output / job_list / job_kill for managed remote background jobs.
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # Verbatim from `standard`: compaction keeps long remote sessions
          # usable; its services stay behind the group's entry-local realm.
          - id: compaction
            name: 'cordis:group'
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # Plan mode: the same section text the standard preset uses.
          - id: planning
            name: 'cordis:group'
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          # Delegation, PINNED to this preset: a spawned child mounts the
          # ssh-remote composition itself (never `standard`), and the model's
          # preset argument is limited to that one value. Fork children inherit
          # the parent composition by construction. Each child is its own
          # session, so it must run ssh_connect itself: a fork child sees the
          # parent's history (credentials included), a spawn child needs the
          # host/user/password in its task prompt.
          - id: delegation
            name: 'cordis:group'
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  agentPreset: ssh-remote
                  allowedAgentPresets:
                    - ssh-remote
                  modelSelectionSettings: true

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork

              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

          # Web search / fetch (host-side) and deliverable cards.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          - id: present
            name: '@deepseek-ai/dsh-tool-present'
