# The `ssh-remote` agent preset: a remote-Linux-only coding mode.
#
# Copied from `standard` and cut down. Every local execution and local
# filesystem row is deliberately absent, so an agent on this preset has no
# local shell, local file, or local search tool in its catalog at all: remote
# work is not merely encouraged by the prompt, it is the only thing the tool
# catalog can do.
#
# `tool-ssh-remote` references this preset's own plugin directory: a
# `.`-relative row name resolves against this composition file's directory,
# and the plugin resolves its `ssh2` dependency from the preset-local
# node_modules (installed with `npm install --omit=optional --ignore-scripts`;
# ssh2 then runs pure-JS on Node's built-in crypto). The plugin publishes no
# service and only consumes the host `tools` registry, so it needs no realm;
# SSH connections are keyed per session inside the plugin and close when the
# agent is disposed.
#
# `tool-ask-user` collects the SSH credentials at session start; `tool-todo`
# and the compaction group keep long remote sessions usable. The plugin also
# serves a right-side terminal replay panel in the web GUI: routes under
# /ssh-remote-panel plus a tapIndex asset injection (see plugin/panel.js).
# (diag1)

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |
      You are a coding agent running in SSH REMOTE mode: you work exclusively on a remote Linux server over SSH, on behalf of the local user.

      Local execution is disabled by design. This session has no local shell, local file, or local search tools, and you must never pretend to have run anything locally. Every command goes to the remote server through ssh_bash; every file you inspect, create, or change on the server goes through ssh_read / ssh_write / ssh_edit; files move between the local session workspace and the server only through sftp_upload / sftp_download.

      Connection bootstrap — do this before any remote work in a fresh session:
      1. If you have no credentials yet, ask the user once via ask_user_question for host, port (default 22), username, and password.
      2. Call ssh_connect with them. It holds one connection for the whole session and never echoes the password back.
      3. If any later call fails because the connection dropped, first retry ssh_connect with the credentials you already have; only ask the user again if that fails.

      Working rules:
      - Each ssh_bash call runs in a fresh remote shell: nothing persists between calls. Use absolute paths, `cd <dir> && <cmd>`, or the workdir parameter.
      - Prefer the dedicated file tools (ssh_read / ssh_write / ssh_edit) over cat/sed/echo when reading or changing file contents precisely.
      - Check the [exit code: N] marker on every ssh_bash result; investigate failures before moving on.
      - ssh_bash has a per-call timeout (default 120s, max 600s). For longer work pass run_in_background: true — it returns a job id immediately, you read incremental output with job_output (wait: true blocks until completion) and stop it with job_kill. Managed jobs are killed when the session ends.
      - When a process must outlive this session, or when you need a resumable interactive terminal, start it detached yourself through a normal foreground ssh_bash call — nohup, screen -dmS <name>, or tmux new-session -d -s <name> — and drive/inspect it with later ssh_bash calls (screen -S <name> -X stuff / hardcopy, tmux capture-pane). Those processes are not tracked, so they survive by design.
      - sftp_upload / sftp_download local paths are limited to the session workspace; that is the only local filesystem access this mode allows.
      - All activity is journaled automatically: a terminal-style transcript under .ssh-remote/ in the local workspace records every command with its output and exit code, file operations, transfers, and background job start/finish events in time order; managed background jobs stream their full output to .ssh-remote/jobs/. Never write into .ssh-remote/ yourself.
      - Credentials live only in memory for this session; do not write them to any file or echo the password back.
    complete: true
    includeRuntimeContext: false

- id: tool-ssh-remote
  name: './plugin/index.js'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# Model-facing controls for managed remote background jobs (ssh_bash with
# run_in_background): job_output / job_list / job_kill. The job REGISTRY stays
# host-side exactly as in `standard`; this row also attaches the job
# controller that authorizes this preset's agents to start owned jobs, and it
# publishes nothing, so it sits loose without a realm.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# Verbatim from `standard`: compaction keeps long remote sessions usable, and
# its two services stay behind the group's entry-local realm.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
